name: "oc mirror with verify and download attentions"

on: [ push, pull_request ]

# Declare default permissions as read only.
permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oc-mirror:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Log in to registry.redhat.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry.redhat.io
          username: ${{ secrets.REDHAT_IO_USERNAME }}
          password: ${{ secrets.REDHAT_IO_TOKEN }}

      - name: Log in to quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_TOKEN }}

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: garethahealy
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Red Hat signing key
        run: wget -O /home/runner/redhat-sigstore.pub https://security.access.redhat.com/data/63405576.txt

      - name: Configure podman policy
        run: |
          mkdir -p ~/.config/containers/registries.d
          cp samples/HOME/.config/containers/policy-redhat.json ~/.config/containers/policy.json
          cp samples/HOME/.config/containers/registries.d/sigstore-registries.yaml ~/.config/containers/registries.d/sigstore-registries.yaml

          podman image trust show

      - name: Install oc-mirror
        run: |
          wget --no-verbose https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/latest/oc-mirror.rhel9.tar.gz
          tar -xzvf oc-mirror.rhel9.tar.gz
          chmod +x oc-mirror

          mkdir oc-mirror-data

      - name: oc-mirror with dry-run
        run: ./oc-mirror --v2 --config samples/oc-mirror/imageset.yaml --workspace file://$(pwd)/oc-mirror-data docker://ghcr.io/garethahealy/redhat-sboms --dry-run

      - name: Download attestations
        run: |
          cat oc-mirror-data/working-dir/dry-run/mapping.txt
          echo ""
          ./download-from-mapping.sh --platform linux/amd64 --source registry.redhat.io --source quay.io --key /home/runner/redhat-sigstore.pub oc-mirror-data/working-dir/dry-run/mapping.txt

      # Commented out due to amount of images, but below works
      #- name: oc-mirror
      #  run: ./oc-mirror --v2 --remove-signatures=false --secure-policy=true --config samples/oc-mirror/imageset.yaml --workspace file://$(pwd)/oc-mirror-data docker://ghcr.io/garethahealy/redhat-sboms

      - name: Archive out/
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: out
          path: out/

