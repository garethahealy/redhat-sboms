name: "Download Attestations"

on: [ push, pull_request ]

# Declare default permissions as read only.
permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  download-attestations:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Log in to registry.redhat.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry.redhat.io
          username: ${{ secrets.REDHAT_IO_USERNAME }}
          password: ${{ secrets.REDHAT_IO_TOKEN }}

      - name: Download Red Hat signing key
        run: wget -O redhat-sigstore.pub https://security.access.redhat.com/data/63405576.txt

      - name: Download Attestations
        run: ./run.sh

      - name: Validate SBOMs
        run: |
          set -euo pipefail
          shopt -s nullglob

          slug() {
            local image="$1"
            image="${image#https://}"
            image="${image#http://}"
            image="${image//\//_}"
            image="${image//:/_}"
            image="${image//@/_}"
            printf '%s\n' "$image"
          }

          failed=0
          found=0
          while IFS= read -r line; do
            read -r -a args <<<"${line}"
            image="${args[${#args[@]} - 1]}"
            dir="./out/$(slug "${image}")"
            sboms=("${dir}"/sbom-*.json)
            found=$((found + 1))
            if ((${#sboms[@]} == 0)); then
              echo "error: no SBOM for ${image} (looked in ${dir})" >&2
              failed=1
              continue
            fi
            echo "ok ${image} (${#sboms[@]} SBOM(s))"
            printf '  %s\n' "${sboms[@]##*/}"
          done < <(grep -E '^[[:space:]]*\./download-attestations\.sh' run.sh || true)

          if ((found == 0)); then
            echo "error: no download-attestations.sh invocations in run.sh" >&2
            exit 1
          fi
          exit "${failed}"
